name: EPG

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - files.json
      - scripts/update_epg.py
      - tests/test_update_epg.py
      - .github/workflows/epg.yml

permissions:
  contents: write

concurrency:
  group: epg-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Test downloader
        run: python3 -m unittest discover -s tests -v

      - name: Download files from files.json
        id: download
        continue-on-error: true
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python3 scripts/update_epg.py

      - name: Commit and push changes
        id: commit
        if: ${{ !cancelled() && steps.download.outcome != 'skipped' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add -- epg/
          if ! git diff --cached --quiet; then
            now_time=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
            git commit -m "更新时间：$now_time"
            # epg-src may publish other files while these downloads run.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "changed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep "$attempt"
            done
            exit 1
          fi

      - name: Check download result
        if: ${{ !cancelled() && steps.download.outcome == 'failure' }}
        run: exit 1

      - name: Check sync configuration
        if: steps.commit.outputs.changed == 'true'
        id: sync
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          if [ -n "$ACCESS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Repository Dispatch
        if: steps.sync.outputs.enabled == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          repository: zsz520/epg
          event-type: sync
